name: kit-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificar estructura del kit
        run: python scripts/check-kit.py

  verify-templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef
      - name: Plantillas kitapi + kit-entity en la matriz perfil × motor (migración, format, Release) y tests con Testcontainers
        run: python scripts/verify/verify-template.py --run-tests
