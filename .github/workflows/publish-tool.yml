# Publica el asistente `dnx NetCoreApiKit` en nuget.org al crear un tag v* (por ejemplo v3.4.0).
# Usa Trusted Publishing (OIDC): no hay API key guardada. GitHub emite un token de un solo uso, nuget.org lo valida
# contra la política de confianza y devuelve una API key temporal (1 hora).
#
# Configuración (una vez):
#   1. nuget.org → tu usuario → Trusted Publishing → nueva política:
#        Repository Owner: vloacode · Repository: NetCore_API_Structure · Workflow File: publish-tool.yml · Environment: nuget
#   2. (Recomendado) GitHub → Settings → Environments → "nuget" → Required reviewers: alguien aprueba cada publicación.
#   El usuario de nuget.org (nombre del perfil, no el email) va abajo en `user`: no es un secreto.
name: publish-tool

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget          # debe coincidir con el Environment de la política en nuget.org
    permissions:
      contents: read
      id-token: write           # permite a GitHub emitir el token OIDC para este job
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Versión del tag = KIT_VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          KIT="$(tr -d '[:space:]' < KIT_VERSION)"
          if [ "$TAG" != "$KIT" ]; then
            echo "::error::El tag v$TAG no coincide con KIT_VERSION $KIT"
            exit 1
          fi

      - name: Verificación rápida del asistente
        run: python scripts/verify/verify-wizard.py --quick

      - name: Empaquetar
        run: dotnet pack tools/NetCoreApiKit -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}

      # Justo antes del push: la API key temporal vence en 1 hora y cada token sirve una sola vez.
      - name: NuGet login (OIDC → API key temporal)
        uses: NuGet/login@v1
        id: login
        with:
          user: VloaCode   # dueño del paquete en nuget.org (perfil, no email)

      - name: Publicar en nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
