# Publica el asistente `dnx NetCoreApiKit` en nuget.org al crear un tag v* (por ejemplo v3.4.0).
# Requiere el secreto del repositorio NUGET_API_KEY (API key de nuget.org con permiso para el paquete NetCoreApiKit).
name: publish-tool

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Versión del tag = KIT_VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          KIT="$(tr -d '[:space:]' < KIT_VERSION)"
          if [ "$TAG" != "$KIT" ]; then
            echo "::error::El tag v$TAG no coincide con KIT_VERSION $KIT"
            exit 1
          fi

      - name: Verificación rápida del asistente
        run: python scripts/verify/verify-wizard.py --quick

      - name: Empaquetar
        run: dotnet pack tools/NetCoreApiKit -c Release -o artifacts -p:Version=${GITHUB_REF_NAME#v}

      - name: Publicar en nuget.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
